<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>404 — Page not found | Wilson Devops</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#05050c" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f8f6f2" media="(prefers-color-scheme: light)" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
<style>
  @font-face { font-family: 'Clash Display'; font-weight: 700; font-display: swap; src: url('/assets/fonts/clash-display-700.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; font-display: swap; src: url('/assets/fonts/jetbrains-mono-latin.woff2') format('woff2'); }
  :root { --bg: #05050c; --ink: #eceef3; --muted: #8c98b2; --accent: #4361ee; --signal: #56e0b0; --line: rgba(75, 85, 110, .4); }
  @media (prefers-color-scheme: light) { :root { --bg: #f8f6f2; --ink: #18182a; --muted: #444a5c; --accent: #2f47c2; --line: rgba(205, 200, 190, .7); } color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Clash Display', system-ui, sans-serif; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; position: relative; overflow: hidden; }
  body::before { content: ''; position: absolute; inset: -30%; background: radial-gradient(circle at 30% 20%, rgba(67, 97, 238, .35), transparent 55%), radial-gradient(circle at 75% 80%, rgba(86, 224, 176, .18), transparent 55%); filter: blur(60px); pointer-events: none; }
  main { position: relative; z-index: 1; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .code { font-size: clamp(5rem, 22vw, 11rem); font-weight: 700; line-height: .9; letter-spacing: -.03em; background: linear-gradient(180deg, var(--ink), rgba(67, 97, 238, .75)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); margin-top: 1rem; }
  p { color: var(--muted); margin-top: .75rem; font-family: system-ui, sans-serif; max-width: 34rem; line-height: 1.6; }
  .actions { margin-top: 2.25rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .9rem 1.75rem; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: .72rem; letter-spacing: .15em; text-transform: uppercase; text-decoration: none; transition: all .3s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.12); box-shadow: 0 10px 30px rgba(67, 97, 238, .3); }
  .btn-ghost { border: 1px solid var(--line); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--signal); color: var(--signal); }
  .status { margin-top: 2.5rem; font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--signal); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>This page has left the build.</h1>
    <p>The URL you requested doesn't exist or has been moved. The engineer is still online though — head back home or jump straight to the work.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">← Back home</a>
      <a class="btn btn-ghost" href="/#work">See my work</a>
      <a class="btn btn-ghost" href="/#contact">Contact</a>
    </div>
    <div class="status mono">status: lost_in_transit</div>
  </main>
</body>
</html>
